{% extends "base.html" %}
{% load static %}

{% comment %}
  Graficas de evolucion y reportes persistidos.

  Las series viajan en un <script type="application/json">, no interpoladas
  dentro del codigo JavaScript: asi ningun dato de la base puede romper el
  script ni inyectar codigo.
{% endcomment %}

{% block title %}SIGMAP-AQUA | Gráficas y reportes{% endblock %}

{% block page_title %}
  <h1>Gráficas y reportes</h1>
  <p>Evolución de los parámetros y reportes guardados por periodo.</p>
{% endblock %}

{% block content %}
<div class="sg-modulo">

  <div class="sg-card">
    <form class="sg-filtros" method="get">
      <div class="sg-filtro">
        <label for="piscina">Piscina</label>
        <select id="piscina" name="piscina" onchange="this.form.submit()">
          {% for p in piscinas %}
            <option value="{{ p.pk }}" {% if seleccionada and seleccionada.pk == p.pk %}selected{% endif %}>{{ p.nombre_piscina }}</option>
          {% empty %}
            <option value="">Sin piscinas registradas</option>
          {% endfor %}
        </select>
      </div>
      <div class="sg-filtro">
        <label for="parametro">Parámetro</label>
        <select id="parametro" name="parametro" onchange="this.form.submit()">
          <option value="">Todos</option>
          {% for par in parametros %}
            <option value="{{ par.pk }}" {% if filtro_parametro == par.pk|stringformat:"s" %}selected{% endif %}>{{ par.nombre_parametro }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="sg-filtro">
        <label for="desde">Desde</label>
        <input type="date" id="desde" name="desde" value="{{ desde }}">
      </div>
      <div class="sg-filtro">
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta" name="hasta" value="{{ hasta }}">
      </div>
      <div class="sg-filtro" style="flex:0 0 auto;min-width:0;">
        <label>&nbsp;</label>
        <button type="submit" class="sg-btn sg-btn--primario">Aplicar</button>
      </div>
    </form>

    {% if resumen and resumen.lecturas %}
      <div class="sg-card-body">
        <div class="sg-fila-kpi" style="margin-bottom:20px;">
          <div class="sg-metrica">
            <span class="sg-metrica-label">Lecturas</span>
            <span class="sg-metrica-valor">{{ resumen.lecturas }}</span>
          </div>
          <div class="sg-metrica">
            <span class="sg-metrica-label">Cumplimiento</span>
            <span class="sg-metrica-valor">{{ resumen.cumplimiento|default:"—" }}%</span>
          </div>
          <div class="sg-metrica">
            <span class="sg-metrica-label">Fuera de rango</span>
            <span class="sg-metrica-valor">{{ resumen.fuera_rango }}</span>
          </div>
          <div class="sg-metrica">
            <span class="sg-metrica-label">Alertas</span>
            <span class="sg-metrica-valor">{{ resumen.alertas }}</span>
          </div>
        </div>

        <div class="sg-grafica">
          <canvas id="graficaEvolucion"></canvas>
        </div>

        <h3 style="margin:26px 0 8px;font-size:13px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;">Resumen por parámetro</h3>
        <div class="sg-tabla-wrap">
          <table class="sg-tabla">
            <thead>
              <tr><th>Parámetro</th><th class="num">Lecturas</th><th class="num">Promedio</th>
                  <th class="num">Mínimo</th><th class="num">Máximo</th>
                  <th class="num">Fuera de rango</th><th>Cumplimiento</th></tr>
            </thead>
            <tbody>
              {% for fila in resumen.parametros %}
                <tr>
                  <td><strong>{{ fila.parametro }}</strong> <small style="color:#9ca3af;">{{ fila.unidad }}</small></td>
                  <td class="num">{{ fila.lecturas }}</td>
                  <td class="num">{{ fila.promedio }}</td>
                  <td class="num">{{ fila.minimo }}</td>
                  <td class="num">{{ fila.maximo }}</td>
                  <td class="num">{{ fila.fuera_rango }}</td>
                  <td>
                    <span class="sg-barra-row">
                      <span style="min-width:44px;font-weight:700;">{{ fila.cumplimiento }}%</span>
                      <span class="sg-barra">
                        <span class="sg-barra-fill {% if fila.cumplimiento >= 95 %}sg-barra-fill--ok{% elif fila.cumplimiento >= 80 %}sg-barra-fill--warn{% else %}sg-barra-fill--crit{% endif %}"
                              style="width: {{ fila.cumplimiento }}%;"></span>
                      </span>
                    </span>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>

        {% if puede_generar %}
          <form method="post" action="{% url 'reportes:reporte_crear' %}" style="margin-top:22px;">
            {% csrf_token %}
            <input type="hidden" name="piscina" value="{{ seleccionada.pk }}">
            <input type="hidden" name="desde" value="{{ desde }}">
            <input type="hidden" name="hasta" value="{{ hasta }}">
            <div class="sg-filtros" style="border:1px solid #e5e7eb;border-radius:8px;">
              <div class="sg-filtro" style="flex:2 1 220px;">
                <label for="titulo">Título del reporte</label>
                <input type="text" id="titulo" name="titulo" placeholder="Se genera uno por defecto si lo dejas vacío">
              </div>
              <div class="sg-filtro">
                <label for="tipo">Tipo</label>
                <select id="tipo" name="tipo">
                  {% for valor, etiqueta in tipos_reporte %}
                    <option value="{{ valor }}" {% if valor == 'personalizado' %}selected{% endif %}>{{ etiqueta }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="sg-filtro" style="flex:0 0 auto;min-width:0;">
                <label>&nbsp;</label>
                <button type="submit" class="sg-btn sg-btn--primario">Guardar como reporte</button>
              </div>
            </div>
            <p class="sg-form-help" style="margin-top:6px;">
              El reporte congela estos datos calculados. No cambiará aunque lleguen lecturas nuevas.
            </p>
          </form>
        {% endif %}
      </div>
    {% else %}
      <div class="sg-vacio">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        <p class="sg-vacio-titulo">Sin datos en este periodo</p>
        <p class="sg-vacio-desc">
          {% if piscinas %}Amplía el rango de fechas o elige otra piscina.
          {% else %}Registra una geomembrana y sus sensores para empezar a graficar.{% endif %}
        </p>
      </div>
    {% endif %}
  </div>

  <!-- Reportes guardados -->
  <div class="sg-card">
    <div class="sg-card-head"><h2>Reportes guardados</h2></div>
    <div class="sg-tabla-wrap">
      <table class="sg-tabla">
        <thead>
          <tr><th>Título</th><th>Piscina</th><th>Periodo</th><th>Tipo</th>
              <th>Generado por</th><th></th></tr>
        </thead>
        <tbody>
          {% for reporte in reportes %}
            <tr>
              <td><strong>{{ reporte.titulo }}</strong><br>
                  <small style="color:#9ca3af;">{{ reporte.resumen_ejecutivo|truncatechars:110 }}</small></td>
              <td>{{ reporte.geomembrana.nombre_piscina }}</td>
              <td>{{ reporte.fecha_inicio|date:"d/m/Y" }} – {{ reporte.fecha_fin|date:"d/m/Y" }}<br>
                  <small style="color:#9ca3af;">{{ reporte.dias_cubiertos }} día(s)</small></td>
              <td><span class="sg-chip sg-chip--info">{{ reporte.get_tipo_reporte_display }}</span></td>
              <td>{{ reporte.generado_por.nombre_completo|default:"—" }}</td>
              <td><a class="sg-btn sg-btn--suave sg-btn--sm" href="{% url 'reportes:reporte_csv' reporte.pk %}">CSV</a></td>
            </tr>
          {% empty %}
            <tr><td colspan="6">
              <div class="sg-vacio">
                <p class="sg-vacio-titulo">Ningún reporte guardado</p>
                <p class="sg-vacio-desc">Consulta un periodo arriba y guárdalo como reporte.</p>
              </div>
            </td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

{# Las series salen del servidor como JSON aislado, no incrustado en el script #}
<script id="datosSeries" type="application/json">{{ series_json|safe }}</script>
{% endblock %}

{% block extra_js %}
<script>
  /**
   * Dibuja la evolucion de cada parametro con Chart.js.
   *
   * Los datos se leen de un bloque JSON aparte; el script nunca contiene
   * valores interpolados desde la base de datos.
   */
  document.addEventListener('DOMContentLoaded', () => {
    const contenedor = document.getElementById('datosSeries');
    const lienzo = document.getElementById('graficaEvolucion');
    if (!contenedor || !lienzo || typeof Chart === 'undefined') return;

    let series;
    try {
      series = JSON.parse(contenedor.textContent);
    } catch (error) {
      console.warn('[SIGMAP] Series ilegibles:', error.message);
      return;
    }

    const nombres = Object.keys(series);
    if (!nombres.length) return;

    // Paleta fija por posicion: el mismo parametro conserva su color al
    // cambiar de piscina, que es lo que permite comparar de un vistazo.
    const COLORES = ['#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2'];

    const datasets = nombres.map((nombre, indice) => ({
      label: `${nombre} (${series[nombre].unidad})`,
      data: series[nombre].puntos.map((punto) => ({ x: punto.t, y: punto.valor })),
      borderColor: COLORES[indice % COLORES.length],
      backgroundColor: COLORES[indice % COLORES.length] + '20',
      borderWidth: 2,
      pointRadius: 2,
      pointHoverRadius: 5,
      tension: 0.3,
      fill: false,
    }));

    new Chart(lienzo, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16 } },
          tooltip: {
            callbacks: {
              title: (items) => new Date(items[0].parsed.x).toLocaleString('es-CO'),
            },
          },
        },
        scales: {
          x: {
            type: 'time',
            time: { tooltipFormat: 'dd/MM/yyyy HH:mm' },
            grid: { display: false },
            ticks: { maxRotation: 0, autoSkipPadding: 20 },
          },
          y: { beginAtZero: false, grid: { color: '#f3f4f6' } },
        },
      },
    });
  });
</script>
{% endblock %}
