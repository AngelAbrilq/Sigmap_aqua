{% load static %}
{% comment %}
  SIGMAP-AQUA · Agente IA flotante
  Archivo: templates/componentes/_agente_ia.html
  Se incluye en el bloque extra_js de templates/funcionalidades/AI.html
{% endcomment %}
<div class="ia-agent" id="iaAgent" data-agent>
  <section class="ia-agent__panel" id="iaAgentPanel" role="dialog"
           aria-modal="false" aria-labelledby="iaAgentTitle" aria-hidden="true">
    <header class="ia-agent__header">
      <span class="ia-agent__avatar" data-agent-avatar>
        <!-- PON AQUÍ LA IMAGEN DE TU AGENTE (cabecera) -->
        <img src="{% static 'img/agente_ia.png' %}" alt="" data-agent-img>
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="iaAgentGradHead" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0e5a8a"/><stop offset="1" stop-color="#14b8a6"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" fill="url(#iaAgentGradHead)"/>
          <path d="M32 13c-7 9-13 16-13 24a13 13 0 0 0 26 0c0-8-6-15-13-24z" fill="#fff" opacity=".95"/>
          <circle cx="27" cy="37" r="2.6" fill="#0e5a8a"/><circle cx="37" cy="37" r="2.6" fill="#0e5a8a"/>
          <path d="M27 43.5c3 2.4 7 2.4 10 0" stroke="#0e5a8a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="ia-agent__title-wrap">
        <h2 class="ia-agent__title" id="iaAgentTitle">Asistente IA - SigmaP Aqua</h2>
        <p class="ia-agent__subtitle">Análisis predictivo en tiempo real</p>
      </div>
      <button type="button" class="ia-agent__close" data-agent-close aria-label="Cerrar asistente">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <div class="ia-agent__body" id="iaAgentBody" aria-live="polite" aria-relevant="additions"></div>

    <footer class="ia-agent__footer">
      <div class="ia-agent__chips" role="group" aria-label="Consultas rápidas">
        <button type="button" class="ia-chip-btn" data-agent-intent="resumen">📊 Resumen predictivo</button>
        <button type="button" class="ia-chip-btn" data-agent-intent="anomalias">⚠️ Ver anomalías</button>
        <button type="button" class="ia-chip-btn" data-agent-intent="recomendacion">💧 Recomendación de hoy</button>
        <button type="button" class="ia-chip-btn" data-agent-intent="pendientes">⏳ Pendientes</button>
      </div>
      <form class="ia-agent__form" data-agent-form autocomplete="off">
        <label for="iaAgentInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Pregunta al asistente</label>
        <input type="text" id="iaAgentInput" class="ia-agent__input" maxlength="120"
               placeholder="Pregunta por pH, turbidez, temperatura…">
        <button type="submit" class="ia-agent__send" aria-label="Enviar consulta">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>
  </section>

  <button type="button" class="ia-agent__trigger" id="iaAgentTrigger" data-agent-toggle
          aria-controls="iaAgentPanel" aria-expanded="false" aria-label="Abrir Asistente IA de SigmaP Aqua">
    <span class="ia-agent__avatar" data-agent-avatar>
      <!-- PON AQUÍ LA IMAGEN DE TU AGENTE (círculo flotante) -->
      <img src="{% static 'img/agente_ia.png' %}" alt="" data-agent-img>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="iaAgentGradBtn" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0e5a8a"/><stop offset="1" stop-color="#14b8a6"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" fill="url(#iaAgentGradBtn)"/>
        <path d="M32 13c-7 9-13 16-13 24a13 13 0 0 0 26 0c0-8-6-15-13-24z" fill="#fff" opacity=".95"/>
        <circle cx="27" cy="37" r="2.6" fill="#0e5a8a"/><circle cx="37" cy="37" r="2.6" fill="#0e5a8a"/>
        <path d="M27 43.5c3 2.4 7 2.4 10 0" stroke="#0e5a8a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="ia-agent__status" title="En línea · Analizando"></span>
    <span class="ia-agent__badge" data-agent-badge hidden></span>
  </button>
</div>
<script src="{% static 'js/ia_agente.js' %}" defer></script>
