<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradiente cielo/agua principal -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbfb8"/>
      <stop offset="40%" stop-color="#5ecfca"/>
      <stop offset="70%" stop-color="#4ab8b2"/>
      <stop offset="100%" stop-color="#2a8e8a"/>
    </linearGradient>
    <!-- Gradiente agua piscinas -->
    <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aafaa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d7a78" stop-opacity="1"/>
    </linearGradient>
    <!-- Gradiente sol -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c69"/>
      <stop offset="60%" stop-color="#f4705a"/>
      <stop offset="100%" stop-color="#e05a45" stop-opacity="0"/>
    </radialGradient>
    <!-- Brillo sol sobre agua -->
    <radialGradient id="sunReflect" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffb08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3aafaa" stop-opacity="0"/>
    </radialGradient>
    <!-- Niebla/neblina fondo -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Fondo general -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Niebla en el horizonte -->
  <ellipse cx="600" cy="340" rx="700" ry="120" fill="#a8e6e3" opacity="0.25" filter="url(#blur)"/>

  <!-- SOL -->
  <circle cx="600" cy="310" r="52" fill="url(#sunGrad)" opacity="0.95"/>
  <!-- Halo sol -->
  <circle cx="600" cy="310" r="80" fill="#f4705a" opacity="0.12" filter="url(#blur)"/>
  <circle cx="600" cy="310" r="110" fill="#ff8c69" opacity="0.07" filter="url(#blur)"/>

  <!-- Reflejo sol en el agua -->
  <ellipse cx="600" cy="430" rx="90" ry="200" fill="url(#sunReflect)" opacity="0.5"/>

  <!-- ===================== PISCINAS EN PERSPECTIVA ===================== -->
  <!-- Piso general de la granja -->
  <rect x="0" y="380" width="1200" height="420" fill="#2a8e8a" opacity="0.6"/>

  <!-- Línea de horizonte / borde del agua -->
  <rect x="0" y="375" width="1200" height="6" fill="#1d6e6a" opacity="0.4"/>

  <!-- === PISCINAS SUPERIORES (perspectiva lejana) === -->
  <!-- Fila superior izquierda -->
  <polygon points="360,380 540,380 510,430 330,430" fill="url(#poolGrad)" opacity="0.85"/>
  <polygon points="540,380 660,380 630,430 510,430" fill="url(#poolGrad)" opacity="0.85"/>
  <polygon points="660,380 840,380 870,430 690,430" fill="url(#poolGrad)" opacity="0.85"/>

  <!-- Bordes piscinas superiores -->
  <polygon points="360,380 540,380 510,430 330,430" fill="none" stroke="#1a6e6b" stroke-width="2"/>
  <polygon points="540,380 660,380 630,430 510,430" fill="none" stroke="#1a6e6b" stroke-width="2"/>
  <polygon points="660,380 840,380 870,430 690,430" fill="none" stroke="#1a6e6b" stroke-width="2"/>

  <!-- === PISCINAS MEDIAS === -->
  <polygon points="120,430 510,430 460,520 60,520" fill="#3aafaa" opacity="0.75"/>
  <polygon points="510,430 690,430 700,520 460,520" fill="#3aafaa" opacity="0.75"/>
  <polygon points="690,430 1080,430 1140,520 700,520" fill="#3aafaa" opacity="0.75"/>

  <!-- Bordes medias -->
  <polygon points="120,430 510,430 460,520 60,520" fill="none" stroke="#156663" stroke-width="2.5"/>
  <polygon points="510,430 690,430 700,520 460,520" fill="none" stroke="#156663" stroke-width="2.5"/>
  <polygon points="690,430 1080,430 1140,520 700,520" fill="none" stroke="#156663" stroke-width="2.5"/>

  <!-- === PISCINAS GRANDES (primer plano) === -->
  <polygon points="0,520 460,520 380,680 -100,680" fill="#2fa8a3" opacity="0.8"/>
  <polygon points="460,520 700,520 700,680 380,680" fill="#2fa8a3" opacity="0.8"/>
  <polygon points="700,520 1140,520 1300,680 700,680" fill="#2fa8a3" opacity="0.8"/>

  <!-- Bordes grandes -->
  <polygon points="0,520 460,520 380,680 -100,680" fill="none" stroke="#0f5350" stroke-width="3"/>
  <polygon points="460,520 700,520 700,680 380,680" fill="none" stroke="#0f5350" stroke-width="3"/>
  <polygon points="700,520 1140,520 1300,680 700,680" fill="none" stroke="#0f5350" stroke-width="3"/>

  <!-- === PECES EN PISCINAS (siluetas pequeñas) === -->
  <!-- Piscina media izquierda -->
  <ellipse cx="200" cy="475" rx="18" ry="7" fill="#1a6e6b" opacity="0.5"/>
  <ellipse cx="280" cy="465" rx="14" ry="5" fill="#1a6e6b" opacity="0.4"/>
  <ellipse cx="350" cy="480" rx="16" ry="6" fill="#1a6e6b" opacity="0.45"/>
  <!-- Piscina media centro -->
  <ellipse cx="580" cy="472" rx="15" ry="6" fill="#1a6e6b" opacity="0.5"/>
  <ellipse cx="620" cy="462" rx="12" ry="5" fill="#1a6e6b" opacity="0.4"/>
  <!-- Piscina media derecha -->
  <ellipse cx="850" cy="475" rx="18" ry="7" fill="#1a6e6b" opacity="0.45"/>
  <ellipse cx="930" cy="465" rx="14" ry="5" fill="#1a6e6b" opacity="0.4"/>

  <!-- Peces piscinas grandes -->
  <ellipse cx="180" cy="590" rx="22" ry="8" fill="#156663" opacity="0.4"/>
  <ellipse cx="300" cy="610" rx="18" ry="7" fill="#156663" opacity="0.35"/>
  <ellipse cx="550" cy="595" rx="20" ry="8" fill="#156663" opacity="0.4"/>
  <ellipse cx="860" cy="600" rx="22" ry="8" fill="#156663" opacity="0.4"/>
  <ellipse cx="980" cy="615" rx="16" ry="6" fill="#156663" opacity="0.35"/>

  <!-- Redes/mallas en las piscinas (líneas de perspectiva) -->
  <!-- Piscina grande izquierda - rejilla -->
  <line x1="0" y1="560" x2="460" y2="540" stroke="#0f5350" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="610" x2="430" y2="585" stroke="#0f5350" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="660" x2="400" y2="630" stroke="#0f5350" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="520" x2="30" y2="680" stroke="#0f5350" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="520" x2="140" y2="680" stroke="#0f5350" stroke-width="1" opacity="0.4"/>
  <line x1="320" y1="520" x2="260" y2="680" stroke="#0f5350" stroke-width="1" opacity="0.4"/>

  <!-- === ESTRUCTURAS / BORDES DE LA GRANJA === -->
  <!-- Caminos entre piscinas -->
  <rect x="455" y="430" width="10" height="250" fill="#1d7a78" opacity="0.6"/>
  <rect x="695" y="430" width="10" height="250" fill="#1d7a78" opacity="0.6"/>

  <!-- === DETALLES DECORATIVOS === -->
  <!-- Burbujas flotando lado derecho -->
  <circle cx="1050" cy="420" r="7" fill="none" stroke="#a8e6e3" stroke-width="1.5" opacity="0.7"/>
  <circle cx="1080" cy="390" r="5" fill="none" stroke="#a8e6e3" stroke-width="1.5" opacity="0.6"/>
  <circle cx="1065" cy="360" r="4" fill="none" stroke="#a8e6e3" stroke-width="1.5" opacity="0.5"/>
  <circle cx="1090" cy="340" r="3" fill="none" stroke="#c8f0ee" stroke-width="1" opacity="0.5"/>
  <circle cx="1110" cy="460" r="6" fill="none" stroke="#a8e6e3" stroke-width="1.5" opacity="0.6"/>
  <circle cx="1130" cy="430" r="4" fill="none" stroke="#a8e6e3" stroke-width="1" opacity="0.5"/>

  <!-- Burbujas lado izquierdo -->
  <circle cx="80" cy="450" r="8" fill="none" stroke="#a8e6e3" stroke-width="1.5" opacity="0.6"/>
  <circle cx="60" cy="420" r="5" fill="none" stroke="#a8e6e3" stroke-width="1.5" opacity="0.5"/>
  <circle cx="95" cy="390" r="4" fill="none" stroke="#c8f0ee" stroke-width="1" opacity="0.5"/>

  <!-- Pez saltando / decoración superior derecha -->
  <g transform="translate(1020, 300) rotate(-30)" opacity="0.6">
    <path d="M0,0 C8,-8 20,-10 28,-5 C20,0 8,5 0,0" fill="#2a8e8a"/>
    <path d="M0,0 L-10,-6 L-8,0 L-10,6 Z" fill="#2a8e8a"/>
  </g>

  <!-- Puntos de burbuja ascendiendo derecha (como en el diseño original) -->
  <circle cx="970" cy="350" r="3" fill="#ff7a60" opacity="0.7"/>
  <circle cx="980" cy="330" r="2.5" fill="#ff8a70" opacity="0.6"/>
  <circle cx="975" cy="310" r="2" fill="#ff9a80" opacity="0.5"/>
  <circle cx="985" cy="295" r="1.5" fill="#ffaa90" opacity="0.4"/>
  <circle cx="978" cy="280" r="1" fill="#ffba9f" opacity="0.35"/>

  <!-- Vapor / niebla sobre el agua -->
  <path d="M100,370 Q200,355 300,368 Q400,381 500,366 Q600,351 700,364 Q800,377 900,362 Q1000,347 1100,360" fill="none" stroke="#b8e8e5" stroke-width="3" opacity="0.3" filter="url(#softBlur)"/>
  <path d="M0,360 Q150,348 300,358 Q450,368 600,355 Q750,342 900,352 Q1050,362 1200,350" fill="none" stroke="#c8eeeb" stroke-width="2" opacity="0.2" filter="url(#softBlur)"/>

  <!-- Sombra inferior para dar profundidad -->
  <rect x="0" y="680" width="1200" height="120" fill="#1a6e6a" opacity="0.5"/>
  <rect x="0" y="740" width="1200" height="60" fill="#0f5350" opacity="0.4"/>
</svg>
